stages:
  - build

variables:
  IMAGE_NAME: $DOCKERHUB_USERNAME/cms-virtual

.docker_build_push: &docker_build_push
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
  script:
    - |
      docker build \
        --build-arg VITE_API_BASE_URL=__VITE_API_BASE_URL__ \
        --build-arg VITE_SERVICE_TOKEN=__VITE_SERVICE_TOKEN__ \
        --build-arg VITE_YOUTUBE_API_KEY=__VITE_YOUTUBE_API_KEY__ \
        -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_NAME:$IMAGE_TAG" \
        .
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

# Rama main → imagen :main y :latest
build_main:
  <<: *docker_build_push
  variables:
    IMAGE_TAG: "latest"
  only:
    - main

# Rama develop → imagen :develop
build_develop:
  <<: *docker_build_push
  variables:
    IMAGE_TAG: "develop"
  only:
    - develop

# Cualquier tag (v1.0.0, release/2.0, etc.) → imagen con ese tag
build_tag:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
  script:
    - |
      docker build \
        --build-arg VITE_API_BASE_URL=__VITE_API_BASE_URL__ \
        --build-arg VITE_SERVICE_TOKEN=__VITE_SERVICE_TOKEN__ \
        --build-arg VITE_YOUTUBE_API_KEY=__VITE_YOUTUBE_API_KEY__ \
        -t "$IMAGE_NAME:$CI_COMMIT_TAG" \
        .
    - docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
  only:
    - tags
