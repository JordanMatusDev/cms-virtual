services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-main.virtual-edu.lat/}
        VITE_SERVICE_TOKEN: ${VITE_SERVICE_TOKEN}
        VITE_YOUTUBE_API_KEY: ${VITE_YOUTUBE_API_KEY}
    ports:
      - "3000:80"
